services:
  - type: web
    name: mydreamhousemiami
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: MLS_CACHE_SECONDS
        value: "3600"
      - key: MLS_PROVIDER
        value: "MIAMI REALTORS / Matrix IDX"
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: LEAD_RECIPIENT_EMAIL
        value: "misaelpeguero@yahoo.com"
      - key: SMTP_HOST
        value: "smtp.mail.yahoo.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: "misaelpeguero@yahoo.com"
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "misaelpeguero@yahoo.com"
      - key: FORMSUBMIT_EMAIL
        value: "misaelpeguero@yahoo.com"
